<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img" aria-labelledby="t d"><title id="t">Преобразование XML через XSLT</title><desc id="d">XML документ и XSLT таблица стилей поступают в процессор и преобразуются в HTML.</desc><style>text{font:24px sans-serif;fill:#262626}.b{fill:#f7eef4;stroke:#5e2750;stroke-width:3}.a{stroke:#5e2750;stroke-width:4;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5e2750"/></marker></defs><rect class="b" x="30" y="50" width="180" height="70" rx="12"/><text x="120" y="93" text-anchor="middle">XML</text><rect class="b" x="30" y="140" width="180" height="70" rx="12"/><text x="120" y="183" text-anchor="middle">XSLT</text><rect class="b" x="350" y="95" width="210" height="80" rx="12"/><text x="455" y="143" text-anchor="middle">XSLT-процессор</text><rect class="b" x="690" y="95" width="180" height="80" rx="12"/><text x="780" y="143" text-anchor="middle">HTML</text><path class="a" d="M210 85 L350 125"/><path class="a" d="M210 175 L350 145"/><path class="a" d="M560 135 L690 135"/></svg>